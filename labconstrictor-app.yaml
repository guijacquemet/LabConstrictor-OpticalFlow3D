# yaml-language-server: $schema=https://cellmigrationlab.github.io/LabConstrictor-Site/schema/labconstrictor-app.schema.json
schema: 1
name: OpticalFlow3D Profiler
summary: Quantify nuclear motion in 3D fluorescence time-lapses with OpticalFlow3D and compare conditions with motion profiles.
description: |-
  OpticalFlow3D Profiler runs the original OpticalFlow3D algorithm (Janelia, BSD-3-Clause) on 3D nuclear time-lapses, extracts motion features per field of view (speed, velocity components, directional coherence, spatial heterogeneity, reliability QC) and compares experimental conditions with MorphoCoverage (Cohen's d, an exploratory FOV-level randomization screen and the paired test on biological-repeat means, with an HTML report).

  Every run records its inputs, calibration, parameters and software versions. Speeds are relative optical-flow speeds of intensity patterns, not tracked nuclear displacements.
kind: analysis
hosts:
- notebook
distribution:
  installer: true
  platforms: [linux-x86_64]
status: Experimental
license: BSD-3-Clause
inputs:
  - Single-channel 3D time-lapse TIFF or OME-TIFF, one field of view per file (TZYX)
  - A MorphoBricks experiment folder (condition / biological repeat / technical repeat, every level optional)
outputs:
  - Upstream-format velocity and reliability volumes with provenance
  - Per-frame and per-FOV motion feature tables with a feature dictionary
  - MorphoCoverage HTML report of the condition comparison (PCA/UMAP, per-feature figures, tests)
limitations:
  - Speeds carry a size-dependent gain bias of the 3D algorithm (see docs/validation.md)
  - Axial (Z) measurements are experimental for shallow Z-stacks
  - About 11-12 GB of RAM per 1840 x 1840 x 11 stack; no tiling or GPU
  - Installer validated on Linux x86-64 only
quickstart:
  - Install the app and open the OpticalFlow3D Profiler notebook from the Welcome page.
  - Choose the experiment and results folders; confirm the axes and calibration of an example image.
  - Choose the optical-flow and feature settings and process the example.
  - Process the whole experiment.
  - Choose the control and open the MorphoCoverage report.
categories: [optical flow, nuclei, cell migration, 3D time-lapse, motion]
icon: app/logo/opticalflow3d_profiler_icon.png
homepage: https://github.com/guijacquemet/LabConstrictor-OpticalFlow3D
docs_url: https://github.com/guijacquemet/LabConstrictor-OpticalFlow3D/blob/main/docs/index.md
