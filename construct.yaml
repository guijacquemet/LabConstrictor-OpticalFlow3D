- app/python_scripts/hide_code_cells.py: OpticalFlow3D Profiler/hide_code_cells.py
- app/python_scripts/include_path.py: OpticalFlow3D Profiler/include_path.py
- app/python_scripts/launch_jupyter.py: OpticalFlow3D Profiler/launch_jupyter.py
- construct.yaml: OpticalFlow3D Profiler/construct.yaml
- notebooks/notebook_latest_versions.yaml: OpticalFlow3D Profiler/notebook_latest_versions.yaml
- requirements.txt: OpticalFlow3D Profiler/requirements.txt
- requirements_gpu.txt: OpticalFlow3D Profiler/requirements_gpu.txt
post_install: app/bash_bat_scripts/post_install.bat # [win]
post_install: app/bash_bat_scripts/post_install.sh # [unix]
pre_uninstall: app/bash_bat_scripts/pre_uninstall.bat # [win]
pre_uninstall: app/bash_bat_scripts/pre_uninstall.sh # [unix]
